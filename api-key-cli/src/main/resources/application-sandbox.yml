# No Docker/Postgres available here (e.g. this repo run standalone, or an agent working in
# a container without Docker access) -- H2 stands in for Postgres, and Flyway runs the
# H2-flavored migrations in db/migration-h2 (not db/migration). Mirrors jogo-acoes' sandbox
# profile -- see memory/constitution.md, "Nomenclatura de ambientes".
spring:
  datasource:
    url: jdbc:h2:file:./data/deployo_api_key;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
