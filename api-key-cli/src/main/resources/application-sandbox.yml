# Claude's sandbox environment: no Docker, but a native PostgreSQL 16 provisioned by the
# environment's own setup script (not versioned here; shared with jogo-acoes) -- cluster 16/main
# on 5432, database deployo_api_key. Same URL/credentials as the docker profile; only the
# Postgres process behind it differs. See specs/009-remove-h2-real-postgres/plan.md and
# memory/constitution.md, "Nomenclatura de ambientes".
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deployo_api_key}
    username: ${SPRING_DATASOURCE_USERNAME:deployo_api_key_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:deployo_api_key_admin}
  flyway:
    enabled: true
