name: Release

# On demand only: run it from the Actions tab, "Run workflow", on main. It reads the version
# from pom.xml, refuses a -SNAPSHOT, runs the same checks as ci.yml, then creates the tag
# v<version> on the selected commit and a GitHub release with the CLI jar attached.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main only (got ${GITHUB_REF})."
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Read the version from pom.xml
        id: version
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          case "$version" in
            *-SNAPSHOT) echo "::error::pom.xml still says $version; set a release version first."; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Start Postgres
        run: docker compose up -d --wait db

      - name: Run tests with coverage (docker profile)
        env:
          SPRING_PROFILES_ACTIVE: docker
        run: mvn -B verify

      - name: Stop Postgres
        if: always()
        run: docker compose down -v

      - name: Create tag and GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: api-key-cli/target/api-key-${{ steps.version.outputs.version }}.jar
