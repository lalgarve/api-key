# Real PostgreSQL, never an in-memory substitute -- `docker compose up -d --wait db` locally/CI,
# or the sandbox environment's native Postgres (same URL/credentials). If it isn't up, tests fail
# with a connection error on purpose. See specs/009-remove-h2-real-postgres/.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deployo_api_key}
    username: ${SPRING_DATASOURCE_USERNAME:deployo_api_key_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:deployo_api_key_admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration-api-key
